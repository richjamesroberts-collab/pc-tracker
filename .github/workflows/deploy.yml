# Builds the app and publishes it to GitHub Pages on every push to main.
# Only the bundled SRD spells are in the repo; spell packs are never committed or published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Pages serves the site at /<repo-name>/ unless the repo is <user>.github.io.
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
      - name: Fail if a spell pack slipped into the build
        run: |
          if grep -rqE "Toll the Dead|Booming Blade|Bigby" build; then
            echo "Non-SRD spell text found in the build. Spell packs must not be published." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
